<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><meta name="theme-color" content="#0b1022"><link rel="icon" href="/brand/favicon.svg" type="image/svg+xml"><link rel="icon" href="/brand/favicon.ico" sizes="48x48"><link rel="icon" type="image/png" sizes="32x32" href="/brand/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="/brand/favicon-16.png"><link rel="apple-touch-icon" href="/brand/apple-touch-icon.png"><link rel="manifest" href="/manifest.webmanifest"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="FUTAlife"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="application-name" content="FUTAlife"><title>FUTAlife — inside</title>
<style>html,body{margin:0;height:100%;background:#0b1022;overflow:hidden;font:14px system-ui,sans-serif;-webkit-user-select:none;user-select:none}canvas{display:block;width:100vw;height:100vh;touch-action:none}
#boot{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#0b1022;color:#fff;font-size:16px;z-index:60;text-align:center;padding:24px}#boot a{color:#fbbf24}</style></head><body>
<canvas id="c"></canvas><div id="boot">Opening the building…</div>
<!-- The inside of a building. URL: /world/interior.html?id=<building id>&n=<building name>&t=<type>[&r=<return url>]  (the map's FUTA_INTERIOR.enter(building) navigates here).
     Dev/preview params: &tpl=hostel  &t2=… see engine.js header.  Preview hour: use  &hour=15  (Nigeria time), day: &d=1 -->
<script src="game/onboarding/config.js"></script>
<script>
(function(){
  const L=(src,cb)=>{const s=document.createElement('script');s.src=src;s.onload=cb;s.onerror=()=>{console.warn('failed',src);cb&&cb()};document.head.appendChild(s)};
  const seq=(list,done)=>{let i=0;(function n(){if(i>=list.length)return done();L(list[i++],n)})()};
  const base=['vendor/three.min.js','game/avatar/avatar-options.js','game/avatar/avatar-core.js','game/avatar/avatar-body.js','game/avatar/avatar-wear.js','game/avatar/avatar-rig.js','game/avatar/avatar-build.js','game/avatar/avatar-npc.js',
   'game/interior/clock.js','game/interior/activities.js','game/live/interact.js',
   'game/interiors/kit.js','game/interiors/furniture.js','game/interiors/acts.js','game/interiors/rooms.js','game/interiors/stage.js','game/interiors/templates.js',
   'game/interiors/tpl_res.js','game/interiors/tpl_bank.js','game/interiors/tpl_edu.js','game/interiors/tpl_commerce.js','game/interiors/tpl_care.js','game/interiors/salon.js','game/interiors/tpl_vault.js',
   'game/live/live.js','game/live/remotes.js','game/live/ui.js','game/live/mock-sb.js','game/onboarding/api.js','game/interiors/engine.js'];
  if(window.FUTA_CONFIG&&window.FUTA_CONFIG.demo) base.splice(base.indexOf('game/interiors/engine.js'),0,'game/interiors/vault-core.js');
  if(!(window.FUTA_CONFIG&&window.FUTA_CONFIG.demo)) base.splice(base.indexOf('game/onboarding/api.js'),0,'vendor/supabase.min.js');
  seq(base,async function(){
    const q=new URLSearchParams(location.search), boot=document.getElementById('boot');
    if(q.get('hour')) FutaClock.setFixed(+q.get('hour'));
    const b={id:q.get('id')||'preview',name:q.get('n')||'',type:q.get('ty')||q.get('type')||''};
    try{
      await FutaEngine.start({canvas:document.getElementById('c'),building:b,tpl:q.get('tpl')||null,variant:q.get('variant')||null,returnUrl:q.get('r')||'/world/'});
      boot.remove();
    }catch(e){ boot.innerHTML='Could not open this building.<br><small>'+String(e.message||e).replace(/</g,'&lt;')+'</small><br><br><a href="'+(q.get('r')||'/world/')+'">Back to the map</a>'; console.error(e); }
  });
})();
</script>
<script src="game/community/community.js" defer></script><script src="game/phone/phone.js" defer></script><script src="/pwa.js" defer></script></body></html>
