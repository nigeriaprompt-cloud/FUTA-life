 const lo=[];for(const p of pts){while(lo.length>1&&cr(lo[lo.length-2],lo[lo.length-1],p)<=0)lo.pop();lo.push(p)}
 const up=[];for(const p of pts.slice().reverse()){while(up.length>1&&cr(up[up.length-2],up[up.length-1],p)<=0)up.pop();up.push(p)}
 up.pop();lo.pop();const H=lo.concat(up);return polyArea(H)<0?H.reverse():H}
function offsetPoly(P,pad){const n=P.length,N=[];for(let i=0;i<n;i++){const a=P[i],b=P[(i+1)%n],dx=b[0]-a[0],dz=b[1]-a[1],L=Math.hypot(dx,dz)||1;N.push([dz/L,-dx/L])}

const polyBox=P=>{let a=1e9,b=-1e9,c=1e9,d=-1e9;for(const p of P){a=Math.min(a,p[0]);b=Math.max(b,p[0]);c=Math.min(c,p[1]);d=Math.max(d,p[1])}return[a,b,c,d]};

function rectFree(cx,cz,hw,hd,a,m,skip){const k=Math.cos(a),s=Math.sin(a);for(let i=0;i<=Math.max(2,Math.ceil(hw*2/3.5));i++)for(let j=0;j<=Math.max(2,Math.ceil(hd*2/3.5));j++){

function loop(n){requestAnimationFrame(loop);const dt=Math.min(.05,(n-last)/1000);last=n;

(async function boot(){
  /* progress: a bar + percentage. The page is busy while it builds the map, so each stage first lets the browser paint (frame()),
     and the long "building" stage lets the bar glide up on its own (CSS transform transition) instead of freezing. */
  const fill=$("ldFill"),msg=$("ldMsg"),pct=$("ldPct"),box=$("load");
  const bar=(p,t,glide)=>{if(!fill)return;if(box)box.classList.toggle("ld-slow",!!glide);fill.style.transform="scaleX("+Math.max(.04,p/100)+")";if(msg&&t)msg.textContent=t;if(pct)pct.textContent=(glide?"…":Math.round(p)+"%")};
  const frame=()=>new Promise(r=>{let d=0;const f=()=>{if(!d){d=1;r()}};requestAnimationFrame(()=>setTimeout(f,0));setTimeout(f,80)});   // never waits more than 80 ms (hidden tabs do not run animation frames)
  try {
    bar(12,"Loading map data…");await frame();
    if(!await loadWorld()){const w=demoWorld();BLD=w.b;RDS=w.r;ARE=w.a;PRP=w.p}
    if(CFG.admin)ADMIN=true;
    bar(28,"Placing buildings, roads and trees…");await frame();
    bar(92,"Placing buildings, roads and trees…",true);await frame();   // glide toward 92% while the (single, long) build runs
    setRegion(REGIONS[0].id,true);
    bar(97,"Opening the campus…");await frame();
    go("campus");
    window._npcCurrentMode = "city";
    requestAnimationFrame(loop);
    bar(100,"Ready");await frame();
  } catch(err) {
    console.error("[boot] failed:", err);
    document.getElementById("load").textContent = "Load error: " + err.message;
    return;
  }
  const ld = document.getElementById("load");
  if (ld) ld.remove();
})();
