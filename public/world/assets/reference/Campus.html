<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Modern Campus</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Familjen+Grotesk:wght@500;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
  /* Layout: full-bleed 3D viewport; title top-left, camera and time-of-day controls docked along the bottom */
  :root {
    --bg: #dfe6ec;
    --fg: #14202b;
    --muted: #4b5c6a;
    --panel: rgba(247, 249, 251, 0.86);
    --line: rgba(20, 32, 43, 0.16);
    --accent: #0b6e8a;
    --accent-fg: #ffffff;
    --display: 'Familjen Grotesk', 'Helvetica Neue', Arial, sans-serif;
    --mono: 'IBM Plex Mono', ui-monospace, Menlo, Consolas, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #10161c; --fg: #e8eef3; --muted: #9aaab7;
      --panel: rgba(20, 28, 36, 0.84); --line: rgba(232, 238, 243, 0.18);
      --accent: #5cc4de; --accent-fg: #07222b; color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #10161c; --fg: #e8eef3; --muted: #9aaab7;
    --panel: rgba(20, 28, 36, 0.84); --line: rgba(232, 238, 243, 0.18);
    --accent: #5cc4de; --accent-fg: #07222b; color-scheme: dark;
  }
  html, body { height: 100%; }
  body { background: var(--bg); color: var(--fg); font-family: var(--display); overflow: hidden; }
  .stage { position: absolute; inset: 0; }
  .stage canvas { display: block; width: 100%; height: 100%; cursor: grab; outline: none; }
  .stage canvas:active { cursor: grabbing; }
  .stage canvas:focus-visible { outline: 2px solid var(--accent); outline-offset: -4px; }
  .hud {
    position: absolute; top: 16px; left: 16px; right: 16px; pointer-events: none;
    display: flex; flex-direction: column; gap: 4px;
  }
  .hud h1 {
    margin: 0; font-size: clamp(1.4rem, 4vw, 2rem); font-weight: 700; letter-spacing: -0.01em;
    color: var(--fg); text-shadow: 0 1px 12px var(--panel); text-wrap: balance;
  }
  .hud p {
    margin: 0; font-family: var(--mono); font-size: 11px; letter-spacing: 0.06em; text-transform: uppercase;
    color: var(--muted); text-shadow: 0 1px 10px var(--panel);
  }
  .dock {
    position: absolute; left: 16px; right: 16px; bottom: 16px;
    padding-bottom: env(safe-area-inset-bottom, 0px);
    display: flex; flex-wrap: wrap; gap: 8px; justify-content: space-between; pointer-events: none;
  }
  .group {
    display: flex; flex-wrap: wrap; gap: 2px; padding: 3px; pointer-events: auto;
    background: var(--panel); border: 1px solid var(--line); border-radius: 8px;
    -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px);
  }
  .group button {
    font-family: var(--mono); font-size: 11px; letter-spacing: 0.07em; text-transform: uppercase;
    color: var(--fg); background: transparent; border: 0; border-radius: 5px; padding: 8px 11px; cursor: pointer;
  }
  .group button:hover { background: var(--line); }
  .group button[aria-pressed="true"] { background: var(--accent); color: var(--accent-fg); }
  .group button:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  #fallback {
    position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
    padding: 24px; text-align: center; color: var(--fg); font-size: 1rem;
  }
</style>
<div class="stage" id="stage"></div>
<header class="hud">
  <h1>Modern Campus</h1>
  <p>2 buildings · 4 students · drag to orbit, scroll or pinch to zoom</p>
</header>
<div class="dock">
  <div class="group" id="views" role="group" aria-label="Camera view">
    <button type="button" data-v="overview" aria-pressed="true">Overview</button>
    <button type="button" data-v="students" aria-pressed="false">Students</button>
    <button type="button" data-v="science" aria-pressed="false">Sciences</button>
    <button type="button" data-v="library" aria-pressed="false">Library</button>
  </div>
  <div class="group" id="times" role="group" aria-label="Time of day">
    <button type="button" data-v="day" aria-pressed="true">Day</button>
    <button type="button" data-v="golden" aria-pressed="false">Golden hour</button>
    <button type="button" data-v="night" aria-pressed="false">Night</button>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function () {
  'use strict';
  var fallback = document.getElementById('fallback');
  var stage = document.getElementById('stage');
  if (typeof THREE === 'undefined') { fallback.hidden = false; return; }

  var renderer;
  try {
    renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
  } catch (err) { fallback.hidden = false; return; }

  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  renderer.outputEncoding = THREE.sRGBEncoding;
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = 0.95;
  stage.appendChild(renderer.domElement);
  var el = renderer.domElement;
  el.style.touchAction = 'none';
  el.setAttribute('tabindex', '0');
  el.setAttribute('aria-label', '3D campus scene. Drag to orbit, scroll to zoom, arrow keys to rotate.');

  var scene = new THREE.Scene();
  var camera = new THREE.PerspectiveCamera(42, 1, 0.1, 2500);

  // ---------- helpers ----------
  var seed = 11;
  function rnd() { seed = (seed * 16807) % 2147483647; return (seed - 1) / 2147483646; }
  function C(h) { return new THREE.Color(h).convertSRGBToLinear(); }
  function canvasTex(size, draw, rx, ry) {
    var c = document.createElement('canvas');
    c.width = c.height = size;
    draw(c.getContext('2d'), size);
    var t = new THREE.CanvasTexture(c);
    t.wrapS = t.wrapT = THREE.RepeatWrapping;
    t.repeat.set(rx, ry);
    t.anisotropy = 8;
    t.encoding = THREE.sRGBEncoding;
    return t;
  }
  function speckle(g, s, n, maxSize, strength) {
    for (var i = 0; i < n; i++) {
      var v = rnd() * 2 - 1;
      g.fillStyle = (v > 0 ? 'rgba(255,255,255,' : 'rgba(0,0,0,') + (Math.abs(v) * strength).toFixed(3) + ')';
      g.fillRect(rnd() * s, rnd() * s, 1 + rnd() * maxSize, 1 + rnd() * maxSize);
    }
  }
  function std(color, rough, metal, extra) {
    var o = { color: C(color), roughness: rough, metalness: metal || 0 };
    if (extra) for (var k in extra) o[k] = extra[k];
    return new THREE.MeshStandardMaterial(o);
  }
  function add(parent, mesh, x, y, z, cast, recv) {
    mesh.position.set(x, y, z);
    mesh.castShadow = cast !== false;
    mesh.receiveShadow = recv !== false;
    (parent || scene).add(mesh);
    return mesh;
  }
  function box(parent, w, h, d, m, x, y, z, cast, recv) {
    return add(parent, new THREE.Mesh(new THREE.BoxGeometry(w, h, d), m), x, y, z, cast, recv);
  }
  function cyl(parent, rt, rb, h, m, x, y, z, seg) {
    return add(parent, new THREE.Mesh(new THREE.CylinderGeometry(rt, rb, h, seg || 20), m), x, y, z);
  }

  // ---------- materials ----------
  var concreteTex = canvasTex(256, function (g, s) {
    g.fillStyle = '#bdbebd'; g.fillRect(0, 0, s, s);
    speckle(g, s, 5500, 3, 0.07);
    speckle(g, s, 500, 10, 0.03);
  }, 6, 2);
  var concrete = new THREE.MeshStandardMaterial({ map: concreteTex, roughness: 0.92, metalness: 0 });
  var concreteDark = std('#8e9296', 0.9);
  var whiteStone = std('#d9d9d4', 0.85);
  var metalDark = std('#23282e', 0.38, 0.75);
  var metalLight = std('#aeb4ba', 0.35, 0.8);
  var woodTex = canvasTex(256, function (g, s) {
    g.fillStyle = '#a67649'; g.fillRect(0, 0, s, s);
    for (var i = 0; i < 90; i++) {
      var v = rnd() * 2 - 1;
      g.fillStyle = (v > 0 ? 'rgba(255,230,190,' : 'rgba(40,20,5,') + (Math.abs(v) * 0.18).toFixed(3) + ')';
      g.fillRect(rnd() * s, 0, 1 + rnd() * 2, s);
    }
  }, 2, 1);
  var timber = new THREE.MeshStandardMaterial({ map: woodTex, roughness: 0.65, metalness: 0 });

  var glass = new THREE.MeshStandardMaterial({
    color: C('#4a6c80'), roughness: 0.04, metalness: 0.92, transparent: true, opacity: 0.58,
    envMapIntensity: 1.5, side: THREE.DoubleSide, depthWrite: false
  });
  var glassTint = new THREE.MeshStandardMaterial({
    color: C('#2c3f4b'), roughness: 0.05, metalness: 0.9, transparent: true, opacity: 0.72,
    envMapIntensity: 1.4, side: THREE.DoubleSide, depthWrite: false
  });
  var interior = new THREE.MeshStandardMaterial({
    color: C('#b9b3a8'), roughness: 0.9, emissive: C('#ffcf8a'), emissiveIntensity: 0, side: THREE.DoubleSide
  });
  var lightStrip = new THREE.MeshBasicMaterial({ color: C('#cfd3d6') });
  var solar = new THREE.MeshStandardMaterial({ color: C('#16264a'), roughness: 0.18, metalness: 0.8, envMapIntensity: 1.3 });
  var lampMat = new THREE.MeshStandardMaterial({ color: C('#f4f1e8'), roughness: 0.4, emissive: C('#ffe2a8'), emissiveIntensity: 0 });

  var grassTex = canvasTex(256, function (g, s) {
    g.fillStyle = '#5d8838'; g.fillRect(0, 0, s, s);
    speckle(g, s, 9000, 2, 0.16);
    for (var i = 0; i < 700; i++) {
      g.fillStyle = 'rgba(' + (rnd() > 0.5 ? '150,190,90' : '30,70,25') + ',0.22)';
      g.fillRect(rnd() * s, rnd() * s, 1, 2 + rnd() * 3);
    }
  }, 90, 90);
  var grassMat = new THREE.MeshStandardMaterial({ map: grassTex, roughness: 1 });
  var lawnMat = new THREE.MeshStandardMaterial({ map: grassTex.clone(), roughness: 1, color: C('#d4ecc0') });
  lawnMat.map.repeat.set(3, 3); lawnMat.map.needsUpdate = true;

  var pavTex = canvasTex(512, function (g, s) {
    g.fillStyle = '#9b9892'; g.fillRect(0, 0, s, s);
    var n = 4, t = s / n;
    for (var i = 0; i < n; i++) for (var j = 0; j < n; j++) {
      var v = 196 + Math.floor(rnd() * 14);
      g.fillStyle = 'rgb(' + v + ',' + (v - 2) + ',' + (v - 7) + ')';
      g.fillRect(i * t + 2, j * t + 2, t - 4, t - 4);
    }
    speckle(g, s, 4000, 2, 0.06);
  }, 14, 7);
  var paving = new THREE.MeshStandardMaterial({ map: pavTex, roughness: 0.82 });

  var barkMat = std('#5a4636', 0.95);
  var leafMats = [std('#4f7d36', 0.9, 0, { flatShading: true }), std('#5f8f3d', 0.9, 0, { flatShading: true }), std('#436f2f', 0.9, 0, { flatShading: true })];
  var shrubMat = std('#3e6a2c', 0.95, 0, { flatShading: true });

  // ---------- sky, env, lights ----------
  var skyMat = new THREE.ShaderMaterial({
    side: THREE.BackSide, depthWrite: false,
    uniforms: { top: { value: new THREE.Color() }, hor: { value: new THREE.Color() }, bot: { value: new THREE.Color() } },
    vertexShader: 'varying vec3 vP;void main(){vP=normalize(position);gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0);}',
    fragmentShader: 'uniform vec3 top;uniform vec3 hor;uniform vec3 bot;varying vec3 vP;void main(){float h=vP.y;vec3 c=h>0.0?mix(hor,top,pow(clamp(h,0.0,1.0),0.5)):mix(hor,bot,clamp(-h*3.0,0.0,1.0));gl_FragColor=vec4(c,1.0);\n#include <tonemapping_fragment>\n#include <encodings_fragment>\n}'
  });
  var skyMesh = new THREE.Mesh(new THREE.SphereGeometry(1200, 32, 16), skyMat);
  skyMesh.renderOrder = -10;
  scene.add(skyMesh);

  var sun = new THREE.DirectionalLight(0xffffff, 2.5);
  sun.castShadow = true;
  sun.shadow.mapSize.set(2048, 2048);
  var sc = sun.shadow.camera;
  sc.left = -48; sc.right = 48; sc.top = 40; sc.bottom = -40; sc.near = 5; sc.far = 260;
  sun.shadow.bias = -0.0004; sun.shadow.normalBias = 0.06;
  scene.add(sun); scene.add(sun.target);
  var hemi = new THREE.HemisphereLight(0xcfe3f2, 0x6b7a5a, 0.3);
  scene.add(hemi);

  var clouds = [];
  var cloudTex = (function () {
    var c = document.createElement('canvas'); c.width = c.height = 128;
    var g = c.getContext('2d');
    var gr = g.createRadialGradient(64, 64, 4, 64, 64, 62);
    gr.addColorStop(0, 'rgba(255,255,255,0.9)'); gr.addColorStop(0.5, 'rgba(255,255,255,0.35)'); gr.addColorStop(1, 'rgba(255,255,255,0)');
    g.fillStyle = gr; g.fillRect(0, 0, 128, 128);
    var t = new THREE.CanvasTexture(c); t.encoding = THREE.sRGBEncoding; return t;
  })();
  for (var ci = 0; ci < 9; ci++) {
    var sp = new THREE.Sprite(new THREE.SpriteMaterial({ map: cloudTex, transparent: true, depthWrite: false, fog: false, opacity: 0.6 }));
    var ang = (ci / 9) * Math.PI * 2 + rnd();
    var rad = 700 + rnd() * 200;
    sp.position.set(Math.sin(ang) * rad, 120 + rnd() * 150, -Math.abs(Math.cos(ang)) * rad * 0.9 - 150);
    if (ci % 3 === 0) sp.position.z = Math.cos(ang) * rad;
    sp.scale.set(300 + rnd() * 240, 70 + rnd() * 40, 1);
    scene.add(sp); clouds.push(sp);
  }

  var PRESETS = {
    day: { top: '#2f73c4', hor: '#d3e4f1', bot: '#a8b4a6', sun: '#fff3df', sunI: 2.6, sunEnv: 14, sunPos: [38, 62, 34], hemi: 0.3, exp: 0.95, fog: '#d3e4f1', cloudC: '#ffffff', cloudO: 0.65, glow: 0, lamp: 0 },
    golden: { top: '#4a6f9c', hor: '#f3bf8c', bot: '#8d8470', sun: '#ffb36e', sunI: 2.5, sunEnv: 16, sunPos: [64, 17, 30], hemi: 0.25, exp: 1.0, fog: '#eab98d', cloudC: '#ffd2a8', cloudO: 0.7, glow: 0.15, lamp: 0.4 },
    night: { top: '#050914', hor: '#26324d', bot: '#10141f', sun: '#9db4ff', sunI: 0.55, sunEnv: 3, sunPos: [-30, 48, -24], hemi: 0.18, exp: 1.05, fog: '#1a2236', cloudC: '#5a6a92', cloudO: 0.25, glow: 1, lamp: 2.6 }
  };
  var pmrem = new THREE.PMREMGenerator(renderer);
  var envRT = null;
  function setSky(mat, p) {
    mat.uniforms.top.value.copy(C(p.top));
    mat.uniforms.hor.value.copy(C(p.hor));
    mat.uniforms.bot.value.copy(C(p.bot));
  }
  function buildEnv(p) {
    var es = new THREE.Scene();
    var m = skyMat.clone();
    m.uniforms = { top: { value: new THREE.Color() }, hor: { value: new THREE.Color() }, bot: { value: new THREE.Color() } };
    setSky(m, p);
    es.add(new THREE.Mesh(new THREE.SphereGeometry(500, 32, 16), m));
    var dir = new THREE.Vector3(p.sunPos[0], p.sunPos[1], p.sunPos[2]).normalize();
    var disc = new THREE.Mesh(new THREE.SphereGeometry(36, 16, 8), new THREE.MeshBasicMaterial({ color: C(p.sun).multiplyScalar(p.sunEnv) }));
    disc.position.copy(dir).multiplyScalar(420);
    es.add(disc);
    var rt = pmrem.fromScene(es, 0.02);
    if (envRT) envRT.dispose();
    envRT = rt;
    scene.environment = rt.texture;
    m.dispose();
  }
  var currentPreset = 'day';
  function applyPreset(name) {
    var p = PRESETS[name]; currentPreset = name;
    setSky(skyMat, p);
    var dir = new THREE.Vector3(p.sunPos[0], p.sunPos[1], p.sunPos[2]).normalize();
    sun.position.copy(dir).multiplyScalar(110);
    sun.color.copy(C(p.sun)); sun.intensity = p.sunI;
    hemi.intensity = p.hemi;
    renderer.toneMappingExposure = p.exp;
    scene.fog = new THREE.Fog(C(p.fog), 95, 420);
    interior.emissiveIntensity = p.glow;
    lightStrip.color.copy(p.glow > 0.5 ? C('#fff1cf').multiplyScalar(2.2) : C('#cfd3d6'));
    lampMat.emissiveIntensity = p.lamp;
    clouds.forEach(function (c) { c.material.color.copy(C(p.cloudC)); c.material.opacity = p.cloudO; });
    buildEnv(p);
  }

  // ---------- ground & plaza ----------
  var ground = new THREE.Mesh(new THREE.PlaneGeometry(1400, 1400), grassMat);
  ground.rotation.x = -Math.PI / 2; ground.receiveShadow = true; scene.add(ground);
  grassTex.repeat.set(220, 220);

  var plaza = new THREE.Mesh(new THREE.PlaneGeometry(74, 34), paving);
  plaza.rotation.x = -Math.PI / 2; plaza.position.set(0, 0.03, 6); plaza.receiveShadow = true; scene.add(plaza);
  box(null, 74.6, 0.12, 0.4, concreteDark, 0, 0.05, 23.2);
  box(null, 0.4, 0.12, 34.6, concreteDark, -37.1, 0.05, 6);
  box(null, 0.4, 0.12, 34.6, concreteDark, 37.1, 0.05, 6);

  // ---------- sign monolith ----------
  function monolith(x, z, ry, line1, line2) {
    var g = new THREE.Group(); g.position.set(x, 0, z); g.rotation.y = ry; scene.add(g);
    box(g, 0.5, 2.4, 1.9, concrete, 0, 1.2, 0);
    var tex = canvasTex(512, function (c, s) {
      c.fillStyle = '#1d242b'; c.fillRect(0, 0, s, s);
      c.fillStyle = '#f2f2ee'; c.textAlign = 'left';
      c.font = '700 56px "Helvetica Neue", Arial, sans-serif'; c.fillText(line1, 36, 190);
      c.font = '400 34px "Helvetica Neue", Arial, sans-serif'; c.fillStyle = '#9fb3c0'; c.fillText(line2, 36, 250);
      c.fillStyle = '#e0a458'; c.fillRect(36, 290, 120, 6);
    }, 1, 1);
    var pl = new THREE.Mesh(new THREE.PlaneGeometry(1.7, 1.7), new THREE.MeshStandardMaterial({ map: tex, roughness: 0.6 }));
    pl.position.set(0.26, 1.35, 0); pl.rotation.y = Math.PI / 2; g.add(pl);
  }

  // ---------- Building A: Engineering & Sciences (cantilevered concrete + glass) ----------
  var gA = new THREE.Group();
  gA.position.set(-19, 0, -7); gA.rotation.y = 0.26; scene.add(gA);
  (function () {
    var intWall = [interior, concrete, concrete, concrete, interior, concrete];
    box(gA, 17, 4.2, 10, intWall, 0, 2.1, -0.5);
    var gf = new THREE.Mesh(new THREE.PlaneGeometry(17, 3.9), glassTint);
    add(gA, gf, 0, 2.15, 4.56, false, false);
    for (var i = 0; i <= 8; i++) box(gA, 0.1, 3.9, 0.2, metalDark, -8.5 + i * 2.125, 2.15, 4.62, false);
    box(gA, 2.6, 3.2, 0.12, metalDark, 0.4, 1.7, 4.7, false);
    var door = new THREE.Mesh(new THREE.PlaneGeometry(2.3, 3.0), glass); add(gA, door, 0.4, 1.7, 4.78, false, false);
    cyl(gA, 0.12, 0.12, 4.4, metalLight, -8.2, 2.2, 5.5);
    cyl(gA, 0.12, 0.12, 4.4, metalLight, 8.2, 2.2, 5.5);
    cyl(gA, 0.12, 0.12, 4.4, metalLight, 11.4, 2.2, 5.5);

    var coreMat = [interior, concrete, concrete, concrete, interior, concrete];
    box(gA, 19.6, 9, 11.4, coreMat, 1.5, 8.9, 0);
    for (var f = 0; f < 4; f++) box(gA, 20.4, 0.42, 12, concrete, 1.5, 4.4 + f * 3.0 + 0.21, 0);
    var soffit = new THREE.Mesh(new THREE.PlaneGeometry(20.4, 1.6), timber);
    soffit.rotation.x = Math.PI / 2; add(gA, soffit, 1.5, 4.18, 5.2, false, true);
    var soffitR = new THREE.Mesh(new THREE.PlaneGeometry(3.2, 11.4), timber);
    soffitR.rotation.x = Math.PI / 2; add(gA, soffitR, 10.1, 4.18, 0, false, true);
    for (var fl = 0; fl < 3; fl++) {
      var yc = 4.4 + fl * 3.0 + 0.42 + 1.25;
      var gp = new THREE.Mesh(new THREE.PlaneGeometry(19.6, 2.5), glass);
      add(gA, gp, 1.5, yc, 5.72, false, false);
      for (var m = 0; m < 15; m++) box(gA, 0.08, 2.5, 0.24, metalDark, -8.1 + m * 1.4, yc, 5.84, false);
      var ge = new THREE.Mesh(new THREE.PlaneGeometry(11.4, 2.5), glass);
      ge.rotation.y = Math.PI / 2; add(gA, ge, 11.32, yc, 0, false, false);
      box(gA, 24.0, 0.05, 0.28, lightStrip, 1.5, yc + 1.05, 4.2, false, false);
      box(gA, 0.28, 0.05, 9.0, lightStrip, 8.5, yc + 1.05, 0, false, false);
    }
    for (var s = 0; s < 22; s++) box(gA, 0.06, 5.6, 0.5, metalDark, -8.2 + s * 0.52, 10.8, 6.45);
    box(gA, 20, 0.12, 0.12, metalDark, 1.5, 13.6, 6.45, false);
    box(gA, 20, 0.12, 0.12, metalDark, 1.5, 8.0, 6.45, false);
    box(gA, 20.4, 0.5, 0.2, concrete, 1.5, 14.0, 5.9);
    box(gA, 5, 1.8, 3.2, concrete, -5, 14.7, -2);
    for (var r = 0; r < 3; r++) for (var q = 0; q < 3; q++) {
      var pnl = box(gA, 2.4, 0.05, 1.3, solar, 3 + q * 2.8, 14.55, -3.5 + r * 2.4);
      pnl.rotation.x = -0.32;
    }
  })();

  // ---------- Building B: University Library (curved glass + timber screen) ----------
  var gB = new THREE.Group();
  gB.position.set(19, 0, -7); gB.rotation.y = -0.26; scene.add(gB);

    var skinM = std(o.skin, 0.55), topM = mat(o.top), botM = mat(o.bottom, 0.8), shoeM = mat(o.shoes, 0.55), hairM = mat(o.hair, 0.5);

    [-1, 1].forEach(function (sd) {

  var walker = makeStudent({ skin: '#8a5a3c', hair: '#15110e', top: '#2d4a63', bottom: '#2a2f3a', shoes: '#f0f0ee', backpack: '#c96b2c', shortSleeve: false });

  // ---------- camera control ----------
  var VIEWS = {
    overview: { t: [0, 4.2, 3], r: 44, az: 0.12, pol: 1.3 },
    students: { t: [0, 1.3, 13.5], r: 17, az: -0.12, pol: 1.43 },

  var cur = { t: new THREE.Vector3(), r: 44, az: 0.12, pol: 1.3 };

  function setView(name, instant) {

  var ptrs = new Map(), lastPinch = 0;

  el.addEventListener('pointerdown', function (e) {
    el.setPointerCapture(e.pointerId);

    if (ptrs.size === 2) lastPinch = pinchDist();
  });
  el.addEventListener('pointermove', function (e) {
    if (!ptrs.has(e.pointerId)) return;
    var p = ptrs.get(e.pointerId);
    var dx = e.clientX - p.x, dy = e.clientY - p.y;
    p.x = e.clientX; p.y = e.clientY;
    if (ptrs.size === 1) {
      goal.az -= dx * 0.006; goal.pol -= dy * 0.005;

  });

    camera.lookAt(cur.t);
    skyMesh.position.copy(camera.position);
    clouds.forEach(function (c) { c.position.x += 0; });

    renderer.render(scene, camera);

  }
  applyPreset('day');
  requestAnimationFrame(frame);
})();
